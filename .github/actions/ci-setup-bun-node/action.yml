name: 'Setup Bun and Node modules'
description: 'instal Bun and Node modules'

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: 1.4.4

    - name: Install Node modules
      run: |
        bun --version
        bun install
      shell: bash
